# Based on upstream dayanch96/YTLite v5.2b4 .github/workflows/main.yml, without the
# companion tweaks and Safari extension. Builds our tweak from tweak/ (or downloads the
# prebuilt YouTube Plus DEB) and injects it into the base IPA.
name: Create YouTube Plus app

on:
  workflow_dispatch:
    inputs:

      tweak:
        description: "source = build tweak/ from this repo, prebuilt = upstream YouTube Plus DEB, none = stock app for comparison"
        default: "source"
        required: true
        type: choice
        options:
          - source
          - prebuilt
          - none

      tweak_version:
        description: "Prebuilt only: YouTube Plus version from dayanch96/YTLite/releases"
        default: "5.2b4"
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      THEOS: ${{ github.workspace }}/theos
      OUT_NAME: YouTube_${{ inputs.tweak == 'source' && 'YTMod' || inputs.tweak == 'none' && 'Stock' || format('Plus_{0}', inputs.tweak_version) }}_${{ github.run_number }}

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4.1.1
        with:
          path: main

      # The base IPA lives in the draft release "base-ipa" so it never sits on a public host.
      - name: Download and validate IPA
        run: |
          gh release download base-ipa --repo ${{ github.repository }} --pattern '*.ipa' --output ${{ github.workspace }}/youtube.ipa

          file_type=$(file --mime-type -b ${{ github.workspace }}/youtube.ipa)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Cache Theos
        if: ${{ inputs.tweak == 'source' }}
        id: theos
        uses: actions/cache@v4
        env:
          cache-name: theos_cache_67db2ab
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: ${{ inputs.tweak == 'source' && steps.theos.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4.1.7
        with:
          repository: theos/theos
          ref: 67db2ab8d950910161730de77c322658ea3e6b44
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Download iOS SDK
        if: ${{ inputs.tweak == 'source' && steps.theos.outputs.cache-hit != 'true' }}
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      # Headers for YouTube's private classes, used by tweak/Tweak.x.
      - name: Clone YouTubeHeader and PSHeader
        if: ${{ inputs.tweak == 'source' }}
        run: |
          cd $THEOS/include
          for repo in YouTubeHeader PSHeader; do
            if [ -d "$repo" ]; then
              git -C "$repo" pull --quiet
            else
              git clone --quiet --depth=1 "https://github.com/PoomSmart/$repo.git"
            fi
          done

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Build tweak from source
        if: ${{ inputs.tweak == 'source' }}
        run: |
          cd main/tweak
          make clean package DEBUG=0 FINALPACKAGE=1
          mv packages/*.deb ${{ github.workspace }}/tweak.deb

      - name: Download YouTube Plus
        if: ${{ inputs.tweak == 'prebuilt' }}
        run: |
          deb_url="https://github.com/dayanch96/YTLite/releases/download/v${{ inputs.tweak_version }}/com.dvntm.ytlite_${{ inputs.tweak_version }}_iphoneos-arm.deb"
          wget "$deb_url" --no-verbose -O ${{ github.workspace }}/tweak.deb

      - name: Inject tweak into IPA
        run: |
          # -u -w -e strip UISupportedDevices, the watch app and app extensions; -f lists files to inject.
          inject=""
          if [ -f tweak.deb ]; then inject="-f tweak.deb"; fi
          cyan -i youtube.ipa -o "$OUT_NAME.ipa" -uwe $inject -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: ytp-${{ github.run_number }}
          name: ${{ env.OUT_NAME }}
          files: ${{ env.OUT_NAME }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
